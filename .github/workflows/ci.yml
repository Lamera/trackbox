# Trackbox's public, fork-safe validation entry point.
# This replaces the upstream self-hosted/autofix pipeline with read-only jobs.
name: Trackbox CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trackbox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm budget

  browser:
    name: Browser interaction (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=chromium
        env:
          CI: 'true'

  scripts:
    name: Repository script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run standalone Node script tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find scripts -name '*.test.mjs' ! -name 'cleanup.test.mjs' -print | sort)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"

  rust-deck:
    name: Rust audio engine checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RB_LITE_TEST: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Upstream contains pre-existing rustfmt differences across the workspace.
      # Keep Clippy + deterministic deck tests gating this CI migration;
      # introduce repo-wide format enforcement only after a scoped cleanup.
      - run: cargo clippy -p rbl-deck --all-targets -- -D warnings
      - run: cargo test -p rbl-deck

# Full native Linux/macOS/Windows smoke tests will be migrated separately.
# No upstream signing, Microsoft Store, R2, Discord, or release secrets here.
